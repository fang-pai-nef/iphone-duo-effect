<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>Duo Flip Demo</title>
<style>
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;
  }

  #scene{
    position:fixed;
    inset:0;
    perspective:900px;
    background:#000;
    overflow:hidden;
  }

  .wallpaper{
    position:absolute;
    inset:-8%;
    transform-origin:center center;
    will-change:transform,filter,opacity;
  }

  #backA{
    background:
      radial-gradient(circle at 22% 25%, rgba(255,105,180,.95), transparent 36%),
      radial-gradient(circle at 78% 28%, rgba(87,116,255,.95), transparent 38%),
      radial-gradient(circle at 58% 76%, rgba(0,240,255,.75), transparent 35%),
      linear-gradient(145deg,#201040,#06162f 55%,#02050d);
  }

  #backB{
    background:
      radial-gradient(circle at 70% 20%, rgba(255,185,70,.95), transparent 36%),
      radial-gradient(circle at 30% 72%, rgba(177,51,255,.9), transparent 42%),
      radial-gradient(circle at 78% 78%, rgba(49,226,178,.7), transparent 35%),
      linear-gradient(145deg,#35140b,#1b1039 56%,#03050d);
    opacity:0;
  }

  #shade{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      linear-gradient(90deg,
        rgba(0,0,0,.95) 0%,
        rgba(0,0,0,.55) 10%,
        rgba(0,0,0,0) 36%,
        rgba(255,255,255,.10) 50%,
        rgba(0,0,0,0) 64%,
        rgba(0,0,0,.55) 90%,
        rgba(0,0,0,.95) 100%);
    opacity:0;
    mix-blend-mode:soft-light;
    will-change:transform,opacity;
  }

  #edge{
    position:absolute;
    top:-10%;
    bottom:-10%;
    width:28%;
    left:36%;
    background:linear-gradient(
      90deg,
      rgba(0,0,0,0),
      rgba(0,0,0,.86) 48%,
      rgba(255,255,255,.10) 51%,
      rgba(0,0,0,0)
    );
    filter:blur(12px);
    opacity:0;
    pointer-events:none;
    will-change:transform,opacity;
  }

  #vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(circle at center,transparent 38%,rgba(0,0,0,.72) 105%);
    opacity:.22;
  }

  #ui{
    position:fixed;
    left:0; right:0; bottom:max(24px,env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    z-index:10;
    transition:opacity .35s ease;
  }

  button{
    border:0;
    color:white;
    background:rgba(20,20,25,.70);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    padding:13px 20px;
    border-radius:999px;
    font-size:16px;
    box-shadow:0 10px 28px rgba(0,0,0,.28);
  }

  #hint{
    color:rgba(255,255,255,.75);
    font-size:12px;
    text-shadow:0 1px 6px #000;
  }

  #debug{
    position:fixed;
    top:max(12px,env(safe-area-inset-top));
    left:12px;
    z-index:20;
    color:rgba(255,255,255,.75);
    font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;
    display:none;
    background:rgba(0,0,0,.35);
    padding:8px 10px;
    border-radius:10px;
  }
</style>
</head>
<body>
  <div id="scene">
    <div id="backA" class="wallpaper"></div>
    <div id="backB" class="wallpaper"></div>
    <div id="shade"></div>
    <div id="edge"></div>
    <div id="vignette"></div>
  </div>

  <div id="debug"></div>

  <div id="ui">
    <button id="startBtn">启用翻转特效</button>
    <div id="hint">授权后缓慢左右翻转 iPhone</div>
  </div>

<script>
(() => {
  const backA = document.querySelector('#backA');
  const backB = document.querySelector('#backB');
  const shade = document.querySelector('#shade');
  const edge = document.querySelector('#edge');
  const ui = document.querySelector('#ui');
  const btn = document.querySelector('#startBtn');
  const hint = document.querySelector('#hint');
  const debug = document.querySelector('#debug');

  let zeroGamma = null;
  let smooth = 0;
  let started = false;

  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const mix = (a,b,t) => a + (b-a)*t;

  function render(rawGamma) {
    if (zeroGamma === null) zeroGamma = rawGamma;

    // 相对初始握持姿态。约 ±65° 视为接近翻面。
    let g = rawGamma - zeroGamma;
    if (g > 180) g -= 360;
    if (g < -180) g += 360;

    const target = clamp(g / 65, -1, 1);

    // 低通，让动画更像系统动画而不是传感器抖动。
    smooth += (target - smooth) * 0.14;

    const s = smooth;
    const a = Math.abs(s);

    // 中间位置（|s|≈1）最暗、最模糊，模拟屏幕“掠过边缘”。
    const fold = Math.pow(a, 1.22);
    const blur = mix(0, 20, fold);
    const scale = mix(1.0, 1.10, fold);
    const rotateY = -s * 72;
    const shiftX = -s * 8;

    backA.style.transform =
      `translate3d(${shiftX}%,0,0) rotateY(${rotateY}deg) scale(${scale})`;
    backA.style.filter =
      `blur(${blur}px) brightness(${mix(1,.46,fold)}) saturate(${mix(1,.82,fold)})`;

    // 翻到另一侧时第二套壁纸渐显。
    const second = clamp((a - .64) / .36, 0, 1);
    backB.style.opacity = second;
    backB.style.transform =
      `translate3d(${-shiftX * .55}%,0,0) rotateY(${rotateY * .25}deg) scale(${mix(1.10,1.01,second)})`;
    backB.style.filter =
      `blur(${mix(20,0,second)}px) brightness(${mix(.52,1,second)})`;

    shade.style.opacity = clamp(fold * .95,0,1);
    shade.style.transform = `translateX(${s*16}%)`;

    edge.style.opacity = clamp((fold-.18)*1.35,0,.92);
    edge.style.transform = `translateX(${s*130}%) scaleX(${mix(1,1.35,fold)})`;

    debug.textContent = `gamma=${rawGamma.toFixed(1)}  relative=${g.toFixed(1)}  progress=${s.toFixed(2)}`;
  }

  function onOrientation(e) {
    if (e.gamma == null) return;
    render(e.gamma);
  }

  async function start() {
    if (started) return;

    try {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        const result = await DeviceOrientationEvent.requestPermission();
        if (result !== 'granted') {
          hint.textContent = '未获得“运动与方向”权限，请在 Safari 中重新允许';
          return;
        }
      }

      window.addEventListener('deviceorientation', onOrientation, true);
      started = true;
      btn.textContent = '重新校准';
      hint.textContent = '保持当前姿势，再点击一次可重新校准';
      ui.style.opacity = '.72';

      btn.onclick = () => {
        zeroGamma = null;
        smooth = 0;
        hint.textContent = '已重新校准';
      };
    } catch (err) {
      hint.textContent = '启动失败：' + err.message;
    }
  }

  btn.addEventListener('click', start);
})();
</script>
</body>
</html>
